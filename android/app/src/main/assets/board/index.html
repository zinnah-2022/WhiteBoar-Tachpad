<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#121729">
<title>হোয়াইটবোর্ড</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="ib" id="homeBtn" aria-label="ফিরে যান"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="pager">
      <button class="ib" id="pgPrev" aria-label="আগের পেজ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span id="pgLabel">১/১</span>
      <button class="ib" id="pgNext" aria-label="পরের পেজ"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="ib" id="pgAdd" aria-label="নতুন পেজ"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="top-end">
      <button class="ib" id="hideBtn" aria-label="রেকর্ডিংয়ের জন্য নিয়ন্ত্রণ লুকান"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="ib" id="moreBtn" aria-label="আরও"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board"></canvas>
    <textarea id="textEditor" spellcheck="false" hidden></textarea>
    <div class="hint" id="hint">যেখানে খুশি লিখুন · দুই আঙুলে সরান ও ছোট-বড় করুন</div>
  </main>

  <section class="controls">
    <div class="tools" id="tools">
      <button class="tb" data-tool="pen" aria-label="কলম"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="tb" data-tool="marker" aria-label="মার্কার"><svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
      <button class="tb" data-tool="eraser" aria-label="ইরেজার"><svg viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L12 20.1"/><path d="M22 21H7M5 11l9 9"/></svg></button>
      <button class="tb" data-tool="laser" aria-label="লেজার"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="tb" data-tool="hand" aria-label="সরান"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
      <button class="tb" data-tool="line" aria-label="রেখা"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
      <button class="tb" data-tool="arrow" aria-label="তীর"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
      <button class="tb" data-tool="rect" aria-label="আয়ত"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
      <button class="tb" data-tool="ellipse" aria-label="বৃত্ত"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="tb" data-tool="text" aria-label="লেখা"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    </div>
    <div class="row color-row">
      <div class="colors" id="colors"></div>
      <button class="more-colors" id="moreColors" aria-label="আরও রং"></button>
    </div>
    <div class="row action-row">
      <div class="sizes" id="sizes">
        <button data-i="0" aria-label="চিকন"><i></i></button>
        <button data-i="1" aria-label="মাঝারি"><i></i></button>
        <button data-i="2" aria-label="মোটা"><i></i></button>
      </div>
      <button class="ib big" id="undoBtn" aria-label="আগের অবস্থা"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib big" id="redoBtn" aria-label="আবার"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="zl" id="zoomLabel" aria-label="স্বাভাবিক মাপে ফিরুন">১০০%</button>
    </div>
  </section>
</div>

<!-- রেকর্ডিংয়ের সময় ছোট ভাসমান নিয়ন্ত্রণ -->
<div class="mini" id="mini" hidden>
  <button class="mb" id="miniPen" aria-label="কলম"><i id="miniDot"></i></button>
  <button class="mb" id="miniEraser" aria-label="ইরেজার"><svg viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L12 20.1"/><path d="M22 21H7M5 11l9 9"/></svg></button>
  <button class="mb" id="miniLaser" aria-label="লেজার"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="mb" id="miniUndo" aria-label="আগের অবস্থা"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="mb" id="miniShow" aria-label="সব নিয়ন্ত্রণ দেখান"><svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
</div>

<div class="sheet" id="colorSheet" hidden>
  <div class="sheet-body">
    <div class="sheet-title">রং বাছুন</div>
    <div class="palette" id="palette"></div>
  </div>
</div>

<div class="sheet" id="moreSheet" hidden>
  <div class="sheet-body">
    <div class="sheet-title">বোর্ডের রং</div>
    <div class="bg-colors" id="bgColors"></div>
    <div class="seg" id="bgPattern">
      <button data-v="none">ফাঁকা</button>
      <button data-v="grid">গ্রিড</button>
      <button data-v="lines">রুল</button>
      <button data-v="dots">ডট</button>
    </div>
    <div class="menu-grid">
      <button class="menu-item" id="saveImg"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>গ্যালারিতে সেভ</button>
      <button class="menu-item" id="shareImg"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>শেয়ার করুন</button>
      <button class="menu-item" id="fitBtn"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>সব লেখা দেখান</button>
      <button class="menu-item" id="clearBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>পেজ পরিষ্কার</button>
      <button class="menu-item danger" id="delPageBtn"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 12h6"/></svg>পেজ মুছুন</button>
    </div>
    <p class="about">টিউটোরিয়াল রেকর্ড করতে উপরের ⛶ বোতাম চাপুন — শুধু বোর্ড আর ছোট একটা নিয়ন্ত্রণ থাকবে। তারপর ফোনের স্ক্রিন রেকর্ড চালু করুন।</p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="board.js"></script>
</body>
</html>
