<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151a2c">
<meta name="mobile-web-app-capable" content="yes">
<title>লিখন প্যাড</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="pad.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">সংযোগ হচ্ছে…</span>
    </div>
    <div class="seg" id="modeSeg">
      <button data-m="line" class="active">লাইন</button>
      <button data-m="free">ফ্রি</button>
    </div>
    <div class="pager">
      <button class="ib" id="pgPrev" aria-label="আগের পেজ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span id="pgLabel">১/১</span>
      <button class="ib" id="pgNext" aria-label="পরের পেজ"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="ib" id="moreBtn" aria-label="আরও"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="pad"></canvas>
    <div class="hint" id="hint">এখানে লিখুন — বোর্ডে সাথে সাথে দেখা যাবে</div>
  </main>

  <section class="controls">
    <div class="row tools-row">
      <button class="tb active" data-tool="pen" aria-label="কলম">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>কলম</span>
      </button>
      <button class="tb" data-tool="marker" aria-label="হাইলাইটার">
        <svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg><span>মার্কার</span>
      </button>
      <button class="tb" data-tool="eraser" aria-label="ইরেজার">
        <svg viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L12 20.1"/><path d="M22 21H7M5 11l9 9"/></svg><span>ইরেজার</span>
      </button>
      <button class="tb" data-tool="laser" aria-label="লেজার">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>লেজার</span>
      </button>
      <div class="sizes" id="sizes">
        <button data-i="0" aria-label="চিকন"><i></i></button>
        <button data-i="1" class="active" aria-label="মাঝারি"><i></i></button>
        <button data-i="2" aria-label="মোটা"><i></i></button>
      </div>
    </div>
    <div class="row color-row">
      <div class="colors" id="colors"></div>
      <button class="more-colors" id="moreColors" aria-label="আরও রং"></button>
    </div>
    <div class="row action-row">
      <button class="ib big" id="undoBtn" aria-label="আগের অবস্থা"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib big" id="redoBtn" aria-label="আবার"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <div class="line-actions" id="lineActions">
        <button class="act" id="spaceBtn">পরের শব্দ<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button class="act primary" id="nlBtn"><svg viewBox="0 0 24 24"><path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="M9 10l-5 5 5 5"/></svg>নতুন লাইন</button>
      </div>
    </div>
  </section>
</div>

<div class="sheet" id="colorSheet" hidden>
  <div class="sheet-body">
    <div class="sheet-title">রং বাছুন</div>
    <div class="palette" id="palette"></div>
  </div>
</div>

<div class="sheet" id="moreSheet" hidden>
  <div class="sheet-body">
    <div class="sheet-title">আরও</div>
    <button class="menu-item" id="newPageBtn">নতুন পেজ</button>
    <button class="menu-item danger" id="clearBtn">এই পেজ পরিষ্কার করুন</button>
    <button class="menu-item" id="reconnectBtn">আবার সংযোগ করুন</button>
    <button class="menu-item" id="scanBtn" hidden>অন্য কম্পিউটারে যুক্ত হন (QR)</button>
    <p class="about">লিখন প্যাড · মোবাইলে লিখুন, বোর্ডে দেখুন</p>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="ov-card">
    <div class="spinner" id="ovSpin"></div>
    <div class="ov-title" id="ovTitle">সংযোগ বিচ্ছিন্ন</div>
    <div class="ov-text" id="ovText">আবার চেষ্টা করা হচ্ছে…</div>
    <button class="act primary" id="ovBtn" hidden>QR আবার স্ক্যান করুন</button>
  </div>
</div>

<script type="module" src="pad.js"></script>
</body>
</html>
